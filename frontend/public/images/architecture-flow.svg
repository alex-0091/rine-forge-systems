<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0e1422" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="400" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid Lines -->
  <path d="M 50 100 H 850 M 50 200 H 850 M 50 300 H 850" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.6"/>
  <path d="M 225 30 V 370 M 450 30 V 370 M 675 30 V 370" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- Flow Connector Lines -->
  <path d="M 180 200 L 290 200" stroke="#6366f1" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="290,195 302,200 290,205" fill="#6366f1" />

  <path d="M 470 200 L 580 200" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="580,195 592,200 580,205" fill="#06b6d4" />

  <!-- Node 1: Inbound Triggers -->
  <g transform="translate(60, 130)">
    <rect width="120" height="140" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="60" cy="45" r="22" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M 53 45 C 53 38 67 38 67 45 C 67 52 53 52 53 45" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="45" r="3" fill="#6366f1" />
    <text x="60" y="88" fill="#f8fafc" font-size="12" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Inbound Ingest</text>
    <text x="60" y="105" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Voice • SMS • Forms</text>
    <rect x="25" y="115" width="70" height="16" rx="8" fill="#1e293b" />
    <text x="60" y="126" fill="#38bdf8" font-size="8" font-family="monospace" font-weight="700" text-anchor="middle">SIP &amp; Webhook</text>
  </g>

  <!-- Node 2: Guardrail & Grounding Core (Center Highlight) -->
  <g transform="translate(300, 110)">
    <rect width="170" height="180" rx="20" fill="#0b1329" stroke="#4f46e5" stroke-width="2" filter="url(#glow)"/>
    <circle cx="85" cy="50" r="26" fill="#4f46e5" fill-opacity="0.2" stroke="#6366f1" stroke-width="2"/>
    <path d="M 75 48 L 82 56 L 96 42" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="85" y="98" fill="#ffffff" font-size="14" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">Grounded AI Core</text>
    <text x="85" y="116" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Strict Zero-Hallucination</text>
    <text x="85" y="130" fill="#64748b" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Edge-TTS &amp; Local Inference</text>
    <rect x="25" y="145" width="120" height="20" rx="10" fill="#4f46e5" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
    <text x="85" y="158" fill="#a5b4fc" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">&lt; 180ms Latency</text>
  </g>

  <!-- Node 3: Deterministic Tools & Dispatches -->
  <g transform="translate(590, 100)">
    <rect width="240" height="200" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="120" y="32" fill="#10b981" font-size="11" font-family="monospace" font-weight="800" text-anchor="middle" letter-spacing="1">ATOMIC ACTION PIPELINE</text>
    
    <!-- Action Item 1 -->
    <g transform="translate(15, 45)">
      <rect width="210" height="38" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 17 19 L 19 21 L 23 17" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="35" y="18" fill="#f8fafc" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Direct Calendar Booking</text>
      <text x="35" y="30" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Google / Outlook Cal Sync</text>
    </g>

    <!-- Action Item 2 -->
    <g transform="translate(15, 92)">
      <rect width="210" height="38" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#06b6d4" fill-opacity="0.2"/>
      <path d="M 17 19 L 19 21 L 23 17" stroke="#06b6d4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="35" y="18" fill="#f8fafc" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Sub-45s SMS Dispatch</text>
      <text x="35" y="30" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Twilio &amp; WhatsApp Auto-Rescue</text>
    </g>

    <!-- Action Item 3 -->
    <g transform="translate(15, 140)">
      <rect width="210" height="38" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#8b5cf6" fill-opacity="0.2"/>
      <path d="M 17 19 L 19 21 L 23 17" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="35" y="18" fill="#f8fafc" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Human Staff Escrow</text>
      <text x="35" y="30" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Urgent SMS &amp; Email Handoff</text>
    </g>
  </g>

  <!-- Bottom Certification Stamp -->
  <g transform="translate(350, 345)">
    <text x="100" y="15" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">RINE FORGE SYSTEMS • DETERMINISTIC WORKFLOW SPEC</text>
  </g>
</svg>
