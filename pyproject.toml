[project]
name = "rine-forge-systems"
version = "1.0.0"
description = "Rine Forge Systems AI Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "google-genai>=0.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "jinja2>=3.1.4"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
